[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulk_http"
version = "0.1.0"
description = "Massive asynchronous, multiprocess HTTP execution engine with on-the-fly filtering, fingerprint evasion, proxy management and crash-safe resumption."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["http", "async", "scraping", "concurrency", "multiprocessing", "curl", "impersonate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "curl_cffi>=0.7",
    "selectolax>=0.3.21",
    "pyahocorasick>=2.0",
    "orjson>=3.9",
    "cloudpickle>=3.0",
    "brotli>=1.1",
    "zstandard>=0.22",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/linoMlv/bulk_http"
Repository = "https://github.com/linoMlv/bulk_http"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_http"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "brotli",
    "zstandard",
    "selectolax.*",
    "ahocorasick",
    "cloudpickle",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["bulk_http"]

[tool.coverage.report]
show_missing = true
skip_covered = true
